name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'

permissions:
  contents: read

env:
  PROJECT: apps/ios/Orange Cloud/Orange Cloud.xcodeproj
  SCHEME: Orange Cloud

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project "$PROJECT"
          -scheme "$SCHEME"

      - name: Archive unsigned app
        run: >-
          xcodebuild archive
          -project "$PROJECT"
          -scheme "$SCHEME"
          -configuration Release
          -archivePath "$RUNNER_TEMP/OrangeCloud.xcarchive"
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          DEVELOPMENT_TEAM=
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='OPENSOURCE_UNLOCKED $(inherited)'

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/OrangeCloud.xcarchive/Products/Applications/Orange Cloud.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/export/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/export/Payload" "$RUNNER_TEMP/OrangeCloud-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-unsigned-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/OrangeCloud-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
